name: Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'supabase/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (worker, frontend, or all)'
        required: false
        default: 'all'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Cloudflare Worker Deployment
  # ===========================================================================
  worker-deploy:
    name: Deploy Cloudflare Worker
    if: github.event.inputs.service == 'worker' || github.event.inputs.service == 'all' || !github.event.inputs.service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        run: pnpm wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ===========================================================================
  # Cloudflare Pages Deployment (Next.js Static Export)
  # ===========================================================================
  frontend-deploy:
    name: Deploy Cloudflare Pages
    needs: worker-deploy
    if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'all' || !github.event.inputs.service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Export
        run: pnpm build
        env:
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_WORKER_URL || 'https://api.trippy.michaelpege.com' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '500705610156-2j6108eea4i6242mtf5reb0uoj6jrvqq.apps.googleusercontent.com' }}

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy out --project-name=trippy --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
